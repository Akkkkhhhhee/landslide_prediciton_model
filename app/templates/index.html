<!DOCTYPE html>
<html>
<head>
    <title>Landslide Prediction</title>
    <style>
    body {
        font-family: Arial, sans-serif;
        background-color: #f5f7fa;
        margin: 40px;
        color: #333;
    }

    h1 {
        text-align: center;
        color: #2c3e50;
    }

    form {
        max-width: 400px;
        margin: 0 auto;
        background: white;
        padding: 30px;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    label {
        display: block;
        font-weight: bold;
        margin-bottom: 6px;
        color: #34495e;
    }

    input[type="number"],
    select {
        width: 100%;
        padding: 8px 12px;
        margin-bottom: 20px;
        border: 1px solid #ccc;
        border-radius: 4px;
        box-sizing: border-box;
        font-size: 14px;
        transition: border-color 0.3s ease;
    }

    input[type="number"]:focus,
    select:focus {
        border-color: #2980b9;
        outline: none;
    }

    button {
        width: 100%;
        background-color: #2980b9;
        color: white;
        font-size: 16px;
        padding: 12px 0;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        transition: background-color 0.3s ease;
    }

    button:hover {
        background-color: #1c5980;
    }

    h2 {
        text-align: center;
        margin-top: 30px;
        color: #27ae60;
    }
</style>

</head>
<body>
    <h1>Landslide Prediction</h1>
    
    <form method="POST" action="/predict">
        <label>Rainfall (mm):</label>
        <input type="number" step="any" name="rainfall" required><br><br>

        <label>Slope Angle (degrees):</label>
        <input type="number" step="any" name="slope_angle" required><br><br>

        <label>Soil Saturation (%):</label>
        <input type="number" step="any" name="soil_saturation" required><br><br>

        <label>Vegetation Cover (%):</label>
        <input type="number" step="any" name="vegetation_cover" required><br><br>

        <label>Earthquake Activity (magnitude):</label>
        <input type="number" step="any" name="earthquake_activity" required><br><br>

        <label>Proximity to Water (m):</label>
        <input type="number" step="any" name="proximity_to_water" required><br><br>

        <label>Soil Type:</label>
        <select name="soil_type" required>
            <option value="Gravel">Gravel</option>
            <option value="Sand">Sand</option>
            <option value="Silt">Silt</option>
        </select><br><br>

        <button type="submit">Predict</button>
    </form>

    {% if prediction_text %}
    <h2>Prediction Result: {{ prediction_text }}</h2>
    {% endif %}
</body>
</html>
